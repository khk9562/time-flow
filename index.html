<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // iOS 는 16px 보다 작은 입력칸을 누르면 화면을 확대하고 되돌리지 않는다.
      // maximum-scale=1 은 iOS 에서 이 자동 확대만 막고 두 손가락 확대는 그대로 둔다.
      // 안드로이드는 같은 값이면 손가락 확대까지 막히므로 iOS 에만 건다.
      if (/iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent))) {
        document.querySelector('meta[name=viewport]').content += ', maximum-scale=1';
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0e0e0f" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="흐름" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>흐름 — 올해가 흐르는 중</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
